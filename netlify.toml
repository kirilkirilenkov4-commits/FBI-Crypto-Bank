[build]
command="npm run build"
publish="dist"
[functions]
directory="netlify/functions"
[[redirects]]
from="/api/market"
to="/.netlify/functions/crypto-prices"
status=200
force=true
[[redirects]]
from="/*"
to="/index.html"
status=200
force=true
[[headers]]
for="/api/market"
[headers.values]
Cache-Control="no-store, max-age=0"
[[headers]]
for="/*"
[headers.values]
X-Content-Type-Options="nosniff"
X-Frame-Options="DENY"
Referrer-Policy="strict-origin-when-cross-origin"
